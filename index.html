<script>
const D=JSON.parse(document.getElementById('d').textContent);
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
f.addEventListener('submit',async ev=>{
  ev.preventDefault(); e.textContent=''; b.disabled=true; b.textContent='Unlocking…';
  try{
    const pw=document.getElementById('p').value;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(D.s),iterations:D.n,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(D.i)},key,dec(D.c));
    const html=new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  }catch(err){
    e.textContent='Incorrect password.'; b.disabled=false; b.textContent='Unlock map';
    document.getElementById('p').select();
  }
});
</script></body></html>
